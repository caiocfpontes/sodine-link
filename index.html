<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caio Pontes · Sodine</title>
<meta name="description" content="Caio Pontes — Sodine Papelaria (Borges de Melo) e Sodine Lubrificantes, em Fortaleza/CE.">
<meta property="og:title" content="Caio Pontes · Sodine">
<meta property="og:description" content="Sodine Papelaria e Sodine Lubrificantes — Fortaleza/CE.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#26348C">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --blue:#26348C; --blue-deep:#1b2569; --blue-bright:#33459e;
    --red:#ED1C21; --orange:#F6821F; --yellow:#FEF200;
    --ink:#171a2e; --muted:#6a6f88; --bg:#f3f5fc; --card:#ffffff; --line:#e2e7f5;
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:'Outfit',sans-serif;color:var(--ink);min-height:100dvh;
    background:
      radial-gradient(1100px 520px at 50% -10%, rgba(38,52,140,.10), transparent 62%),
      linear-gradient(180deg,#f6f8fe,var(--bg));
    display:flex;justify-content:center;padding:40px 18px 56px;
  }
  /* textura sutil de pontos */
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:radial-gradient(rgba(38,52,140,.14) 1px,transparent 1px);
    background-size:22px 22px;opacity:.35;
    -webkit-mask-image:radial-gradient(circle at 50% 20%,#000,transparent 70%);
            mask-image:radial-gradient(circle at 50% 20%,#000,transparent 70%);}
  .wrap{position:relative;z-index:1;width:100%;max-width:430px;display:flex;flex-direction:column;align-items:center}

  /* ---- marca pessoal ---- */
  .mark{width:104px;height:104px;border-radius:30px;background:linear-gradient(150deg,var(--blue-bright),var(--blue-deep));
    display:grid;place-items:center;position:relative;
    box-shadow:0 18px 40px rgba(27,37,105,.30);animation:pop .55s cubic-bezier(.2,.9,.3,1.2) both}
  .mark span{font-family:'Bricolage Grotesque';font-weight:800;font-size:42px;color:#fff;letter-spacing:-1px}
  .mark::after{content:"";position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
    width:42px;height:5px;border-radius:4px;
    background:linear-gradient(90deg,var(--red) 0 33%,var(--orange) 33% 66%,var(--yellow) 66% 100%)}
  .name{font-family:'Bricolage Grotesque';font-weight:800;font-size:29px;letter-spacing:-.6px;margin-top:18px;
    animation:fade .5s .08s both}
  .tag{color:var(--muted);font-size:13.5px;font-weight:500;text-align:center;margin-top:7px;line-height:1.5;
    max-width:300px;animation:fade .5s .13s both}
  .tag b{color:var(--blue);font-weight:600}

  /* ---- cartões ---- */
  .cards{width:100%;display:flex;flex-direction:column;gap:14px;margin-top:30px}
  .card{position:relative;display:flex;align-items:center;gap:16px;background:var(--card);
    border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;text-decoration:none;color:var(--ink);
    overflow:hidden;box-shadow:0 6px 18px rgba(27,37,105,.05);
    transition:transform .18s,box-shadow .18s,border-color .18s;animation:rise .5s both}
  .card:nth-child(1){animation-delay:.2s}.card:nth-child(2){animation-delay:.27s}.card:nth-child(3){animation-delay:.34s}
  .card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(27,37,105,.13);border-color:var(--blue)}
  /* barra lateral tricolor */
  .card .bars{flex:0 0 auto;width:7px;height:46px;border-radius:6px;
    background:linear-gradient(180deg,var(--red) 0 33%,var(--orange) 33% 66%,var(--yellow) 66% 100%)}
  .card.solid .bars{background:var(--blue)}
  .card .ic{flex:0 0 auto;width:46px;height:46px;border-radius:13px;background:var(--blue);
    display:grid;place-items:center}
  .card .ic svg{width:24px;height:24px;fill:#fff}
  .card .txt{display:flex;flex-direction:column;gap:2px}
  .card .txt b{font-family:'Bricolage Grotesque';font-weight:700;font-size:16.5px;letter-spacing:-.2px}
  .card .txt span{font-size:12.5px;color:var(--muted)}
  .card .arrow{margin-left:auto;color:var(--blue);font-size:20px;opacity:.55;transition:transform .2s,opacity .2s}
  .card:hover .arrow{transform:translateX(4px);opacity:1}

  .footer{color:var(--muted);font-size:11.5px;text-align:center;margin-top:30px;animation:fade .5s .5s both}
  .footer b{color:var(--blue);font-weight:600}

  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
  <main class="wrap">

    <div class="mark"><span>CP</span></div>
    <h1 class="name">Caio Pontes</h1>
    <p class="tag">Economista de formação, empreendedor por vocação · Fortaleza/CE</p>

    <div class="cards">

      <a class="card solid" href="sobre.html">
        <span class="bars"></span>
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4 0-8 2-8 5v1h16v-1c0-3-4-5-8-5z"/></svg></span>
        <span class="txt"><b>Quem sou eu</b><span>Formação e trajetória</span></span>
        <span class="arrow">→</span>
      </a>

      <a class="card solid" href="varejo.html">
        <span class="bars"></span>
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M4 4h16l-1 5H5L4 4zm1 7h14v9H5v-9zm4 2v5h6v-5H9z"/></svg></span>
        <span class="txt"><b>Sodine Papelaria — Borges de Melo</b><span>Escolar, escritório, informática e mais</span></span>
        <span class="arrow">→</span>
      </a>

      <a class="card" href="lubrificantes.html">
        <span class="bars"></span>
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M3 6h11v9H3V6zm12 3h4l2 3v3h-6V9zM6.5 19a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm11 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg></span>
        <span class="txt"><b>Sodine Lubrificantes</b><span>Venda B2B de lubrificantes no Ceará</span></span>
        <span class="arrow">→</span>
      </a>

    </div>

    <p class="footer">© <span id="ano"></span> · <b>Sodine</b> · Fortaleza/CE</p>
  </main>
  <script>document.getElementById('ano').textContent=new Date().getFullYear()</script>
</body>
</html>
